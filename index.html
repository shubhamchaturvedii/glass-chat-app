<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private Secure Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #121212; color: #e0e0e0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* Clean Header */
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #1f1f1f; border-bottom: 1px solid #2c2c2c; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: #333; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .info h3 { font-size: 0.95rem; color: #fff; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .status { font-size: 0.72rem; color: #888; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #666; display: inline-block; }
    .dot.online { background: #22c55e; }

    .header-actions { display: flex; gap: 8px; }
    .icon-btn { background: #2c2c2c; border: none; color: #ccc; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem; }

    /* Chat Messages Box */
    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: #0b0b0b; }
    .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 0.92rem; line-height: 1.4; word-wrap: break-word; }
    .sent { background: #005c4b; color: #e9edef; align-self: flex-end; border-bottom-right-radius: 3px; }
    .received { background: #202c33; color: #e9edef; align-self: flex-start; border-bottom-left-radius: 3px; }
    .meta { font-size: 0.62rem; color: rgba(255,255,255,0.5); margin-top: 3px; text-align: right; }

    /* Input Footer */
    footer { display: flex; padding: 10px 12px; background: #1f1f1f; border-top: 1px solid #2c2c2c; gap: 8px; align-items: center; }
    input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 0.95rem; outline: none; }
    input:focus { border-color: #00a884; }
    .send-btn { background: #00a884; color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }

    /* Settings & Setup Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-card { width: 100%; max-width: 320px; background: #1f1f1f; border: 1px solid #333; border-radius: 16px; padding: 20px; color: #fff; }
    .modal-card h2 { font-size: 1.1rem; margin-bottom: 4px; }
    .modal-card p { font-size: 0.78rem; color: #888; margin-bottom: 16px; }
    .modal-card label { font-size: 0.75rem; color: #aaa; display: block; margin-bottom: 4px; }
    .modal-card input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #121212; color: #fff; font-size: 0.9rem; margin-bottom: 12px; outline: none; }
    .modal-card button { width: 100%; padding: 10px; border-radius: 8px; background: #00a884; color: #fff; border: none; font-weight: 600; cursor: pointer; }
  </style>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <!-- Settings / Setup Modal -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-card">
      <h2 id="modal-title">Chat Settings</h2>
      <p>Apna naam aur Secret Room ID set karein</p>
      
      <label>Aapka Naam:</label>
      <input type="text" id="input-name" placeholder="Jaise: Rahul">

      <label>Secret Room ID (Dono ke liye same honi chahiye):</label>
      <input type="text" id="input-room" placeholder="Jaise: secret_chat_99">

      <button onclick="saveSettings()">Save & Start Chat</button>
    </div>
  </div>

  <header>
    <div class="header-left">
      <div class="avatar"><img id="partner-avatar" src="" alt=""></div>
      <div class="info">
        <h3><span id="partner-title">Private Chat</span> <span id="status-dot" class="dot"></span></h3>
        <div id="status-text" class="status-text">Connecting...</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="openSettings()" title="Settings">⚙️</button>
      <button class="icon-btn" onclick="clearChat()" title="Clear Chat">🗑️</button>
    </div>
  </header>

  <div id="chat-box"></div>

  <footer>
    <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
    <button class="send-btn" onclick="sendMsg()">➤</button>
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAcZOL17YwXCJZrltpho6NA98I2ocFNnoc",
      authDomain: "liquid-a283e.firebaseapp.com",
      databaseURL: "https://liquid-a283e-default-rtdb.firebaseio.com",
      projectId: "liquid-a283e",
      storageBucket: "liquid-a283e.firebasestorage.app",
      messagingSenderId: "785719171019",
      appId: "1:785719171019:web:947ce4a9b48a1e3670484e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName = localStorage.getItem("my_chat_name");
    let roomId = localStorage.getItem("my_room_id");

    const modal = document.getElementById("settings-modal");
    if (!myName || !roomId) {
      modal.style.display = "flex";
    } else {
      startChatApp();
    }

    function openSettings() {
      document.getElementById("input-name").value = myName || "";
      document.getElementById("input-room").value = roomId || "";
      modal.style.display = "flex";
    }

    function saveSettings() {
      const nameVal = document.getElementById("input-name").value.trim();
      const roomVal = document.getElementById("input-room").value.trim();
      if (!nameVal || !roomVal) {
        alert("Dono fields zaroori hain!");
        return;
      }
      localStorage.setItem("my_chat_name", nameVal);
      localStorage.setItem("my_room_id", roomVal);
      location.reload();
    }

    function startChatApp() {
      const msgRef = db.ref(`rooms/${roomId}/messages`);
      const presenceRef = db.ref(`rooms/${roomId}/presence`);

      const chatBox = document.getElementById("chat-box");
      const msgInput = document.getElementById("msg-input");
      const statusDot = document.getElementById("status-dot");
      const statusText = document.getElementById("status-text");
      const partnerTitle = document.getElementById("partner-title");
      const partnerAvatar = document.getElementById("partner-avatar");

      // Presence
      const myPresence = presenceRef.child(myName);
      myPresence.set({ online: true, typing: false, updated: firebase.database.ServerValue.TIMESTAMP });
      myPresence.onDisconnect().set({ online: false, typing: false });

      document.addEventListener("visibilitychange", () => {
        myPresence.update({ online: !document.hidden });
      });

      msgInput.addEventListener("input", () => {
        myPresence.update({ typing: msgInput.value.length > 0 });
      });

      presenceRef.on("value", (snapshot) => {
        const users = snapshot.val() || {};
        let found = false;
        for (let u in users) {
          if (u !== myName) {
            found = true;
            partnerTitle.innerText = u;
            partnerAvatar.src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(u)}`;
            if (users[u].online) {
              statusDot.classList.add("online");
              statusText.innerText = users[u].typing ? "typing..." : "online";
            } else {
              statusDot.classList.remove("online");
              statusText.innerText = "offline";
            }
          }
        }
        if (!found) {
          partnerTitle.innerText = "Waiting for partner...";
          statusText.innerText = "Share Room ID with friend";
          partnerAvatar.src = `https://api.dicebear.com/7.x/avataaars/svg?seed=waiting`;
        }
      });

      msgRef.on("child_added", (snapshot) => {
        const data = snapshot.val();
        const div = document.createElement("div");
        div.className = "msg " + (data.sender === myName ? "sent" : "received");
        const time = data.time ? new Date(data.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";
        div.innerHTML = `<div>${data.text}</div><div class="meta">${time}</div>`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      });

      msgRef.on("value", (snapshot) => {
        if (!snapshot.exists()) chatBox.innerHTML = "";
      });

      window.sendMsg = function() {
        const text = msgInput.value.trim();
        if (!text) return;
        msgRef.push({ sender: myName, text: text, time: firebase.database.ServerValue.TIMESTAMP });
        msgInput.value = "";
        myPresence.update({ typing: false });
      };

      window.clearChat = function() {
        if (confirm("Saari chat delete karein?")) msgRef.remove();
      };

      msgInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMsg();
      });
    }
  </script>
</body>
</html>
