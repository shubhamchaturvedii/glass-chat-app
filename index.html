<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Liquid Glass Private Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #060913;
      color: #ffffff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Cosmic Liquid Background Blobs */
    .bg-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.55;
      pointer-events: none;
    }
    .blob-1 {
      width: 260px; height: 260px;
      background: #1d4ed8;
      top: -40px; left: -60px;
      animation: float 9s infinite alternate ease-in-out;
    }
    .blob-2 {
      width: 240px; height: 240px;
      background: #0ea5e9;
      bottom: 8%; right: -50px;
      animation: float 11s infinite alternate-reverse ease-in-out;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(25px, 35px) scale(1.1); }
    }

    /* Liquid Glass Header */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }
    .room-title {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .online-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #64748b;
      transition: all 0.3s ease;
    }
    .online-dot.active {
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
    }
    .status-sub {
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 2px;
    }

    /* Dynamic Moon (White to Blue Glow) */
    .moon-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .moon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
      transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .clear-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.75);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* Chat Area */
    #chat-box {
      position: relative;
      z-index: 5;
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 32px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.94rem;
      line-height: 1.4;
      word-wrap: break-word;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(10px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .sent {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.48), rgba(14, 165, 233, 0.32));
      border: 1px solid rgba(125, 211, 252, 0.35);
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.2);
    }

    .received {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .meta {
      font-size: 0.65rem;
      opacity: 0.55;
      margin-top: 4px;
      text-align: right;
    }

    /* Snapchat Style Peeking Avatar (Bottom Left) */
    #peeker {
      position: absolute;
      bottom: 74px;
      left: -65px; /* Default chhipa hua */
      z-index: 20;
      display: flex;
      align-items: center;
      transition: left 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }
    /* Jab samne wala chat par online ho toh slide out hoga */
    #peeker.peeking {
      left: -6px;
    }
    .avatar-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(56, 189, 248, 0.7);
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transform: rotate(10deg);
    }
    .avatar-circle img {
      width: 90%;
      height: 90%;
      object-fit: cover;
    }

    /* Typing Dots Bubble */
    .typing-bubble {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 7px 11px;
      border-radius: 14px;
      margin-left: 6px;
      display: none;
      gap: 4px;
      align-items: center;
    }
    #peeker.typing .typing-bubble {
      display: flex;
    }
    .dot {
      width: 5px; height: 5px;
      background: #38bdf8;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* Liquid Glass Input Bar */
    footer {
      position: relative;
      z-index: 10;
      padding: 10px 14px 14px 14px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.3s;
    }
    input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }
    input:focus {
      border-color: rgba(56, 189, 248, 0.7);
      background: rgba(255, 255, 255, 0.1);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(125, 211, 252, 0.4);
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
    }
  </style>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <!-- Liquid Background Glows -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <header>
    <div class="user-info">
      <div class="room-title">
        <span id="partner-name">Private Space</span>
        <div id="online-dot" class="online-dot"></div>
      </div>
      <div id="status-text" class="status-sub">Waiting for partner...</div>
    </div>

    <div class="moon-box">
      <div id="moon" class="moon" title="Chat Energy Moon"></div>
      <button class="clear-btn" onclick="clearChat()">Clear</button>
    </div>
  </header>

  <div id="chat-box"></div>

  <!-- Snapchat Style Peeking Bitmoji/Avatar -->
  <div id="peeker">
    <div class="avatar-circle">
      <img id="peeker-img" src="https://api.dicebear.com/7.x/adventurer/svg?seed=Partner" alt="avatar">
    </div>
    <div class="typing-bubble">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <footer>
    <input type="text" id="msg-input" placeholder="Message..." autocomplete="off">
    <button class="send-btn" onclick="sendMsg()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </footer>

  <script>
    // ==========================================
    // 1. APNA FIREBASE CONFIG YAHAN PASTE KAREIN
    // ==========================================
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. User Setup
    let myName = localStorage.getItem("liquid_chat_user");
    if (!myName) {
      myName = prompt("Apna naam likhein:") || "User1";
      localStorage.setItem("liquid_chat_user", myName.trim());
    }

    const roomId = "private_liquid_room_01";
    const msgRef = db.ref(`rooms/${roomId}/messages`);
    const presenceRef = db.ref(`rooms/${roomId}/presence`);

    const chatBox = document.getElementById("chat-box");
    const msgInput = document.getElementById("msg-input");
    const peeker = document.getElementById("peeker");
    const peekerImg = document.getElementById("peeker-img");
    const moon = document.getElementById("moon");
    const onlineDot = document.getElementById("online-dot");
    const statusText = document.getElementById("status-text");
    const partnerNameEl = document.getElementById("partner-name");

    let msgCount = 0;
    let typingTimer;

    // 3. Moon Glow Function (White -> Sky Blue -> Deep Electric Blue)
    function updateMoonGlow(count) {
      // 35 messages par full neon blue glow ho jayega
      const ratio = Math.min(count / 35, 1);
      const r = Math.round(255 - ratio * (255 - 14));
      const g = Math.round(255 - ratio * (255 - 165));
      const b = Math.round(255 - ratio * (255 - 233));
      const spread = 10 + ratio * 28;

      moon.style.background = `rgb(${r}, ${g}, ${b})`;
      moon.style.boxShadow = `0 0 ${spread}px rgb(${r}, ${g}, ${b}), 0 0 ${spread * 1.6}px rgba(14, 165, 233, ${ratio})`;
    }

    // 4. Online Presence & Typing State
    const myPresence = presenceRef.child(myName);

    function setMyState(isOnline, isTyping = false) {
      myPresence.set({
        online: isOnline,
        typing: isTyping,
        updated: firebase.database.ServerValue.TIMESTAMP
      });
    }

    myPresence.onDisconnect().set({ online: false, typing: false });
    setMyState(true, false);

    // Tab switch ya minimize karne par avatar chhip jayega
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        setMyState(false, false);
      } else {
        setMyState(true, false);
      }
    });

    // Typing Listener
    msgInput.addEventListener("input", () => {
      setMyState(true, msgInput.value.length > 0);
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => setMyState(true, false), 2000);
    });

    // 5. Samne wale ka Presence Listen karna (Snapchat Peeking Avatar)
    presenceRef.on("value", (snapshot) => {
      const users = snapshot.val() || {};
      let partnerFound = false;

      for (let user in users) {
        if (user !== myName) {
          partnerFound = true;
          const state = users[user];
          partnerNameEl.innerText = user;
          peekerImg.src = `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(user)}`;

          if (state.online) {
            peeker.classList.add("peeking");
            onlineDot.classList.add("active");
            statusText.innerText = state.typing ? "typing..." : "In chat right now";
          } else {
            peeker.classList.remove("peeking");
            onlineDot.classList.remove("active");
            statusText.innerText = "Offline";
          }

          if (state.typing && state.online) {
            peeker.classList.add("typing");
          } else {
            peeker.classList.remove("typing");
          }
        }
      }
    });

    // 6. Messages Load & Display
    msgRef.on("child_added", (snapshot) => {
      const data = snapshot.val();
      msgCount++;
      updateMoonGlow(msgCount);

      const div = document.createElement("div");
      div.className = "msg " + (data.sender === myName ? "sent" : "received");

      const time = data.time ? new Date(data.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";
      div.innerHTML = `<div>${data.text}</div><div class="meta">${time}</div>`;

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    msgRef.on("value", (snapshot) => {
      if (!snapshot.exists()) {
        chatBox.innerHTML = "";
        msgCount = 0;
        updateMoonGlow(0);
      }
    });

    // 7. Send & Clear Functions
    function sendMsg() {
      const text = msgInput.value.trim();
      if (!text) return;

      msgRef.push({
        sender: myName,
        text: text,
        time: firebase.database.ServerValue.TIMESTAMP
      });

      msgInput.value = "";
      setMyState(true, false);
    }

    function clearChat() {
      if (confirm("Dono ke phone se saari chat delete karein?")) {
        msgRef.remove();
      }
    }

    msgInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMsg();
    });
  </script>
</body>
  </html>
